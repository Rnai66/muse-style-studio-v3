services:
  # 1. API Server & Worker (รวบตึง 2 ระบบให้อยู่ในโควต้าฟรี 1 เครื่อง)
  - type: web
    name: muse-backend
    env: docker
    plan: free
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    dockerCommand: bash start.sh
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: muse-redis
          property: connectionString
      - key: FRONTEND_URL
        value: https://muse-style-studio-v3.web.app
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: VITE_RNAI_API_KEY
        sync: false
      - key: HUGGINGFACE_API_TOKEN
        sync: false
      - key: RENDER
        value: "true"

  # 2. Message Broker (Redis ฟรี 25MB)
  - type: redis
    name: muse-redis
    plan: free
    ipAllowList: []
